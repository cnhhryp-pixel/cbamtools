name: Quality checks

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "quality-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      GITHUB_PAGES: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build static site
        run: npm run build
      - name: Check internal links
        run: npm run check:links
      - name: Check contact emails
        run: npm run check:contacts
      - name: Check commercial config
        run: npm run check:commercial
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=critical
